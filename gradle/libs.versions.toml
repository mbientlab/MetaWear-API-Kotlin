[versions]
kotlin = "2.1.20"
kotlinxCoroutines = "1.10.1"
kotlinxDatetime = "0.6.2"
junit = "5.11.4"
turbine = "1.2.0"
agp = "9.2.1"
nordicBle = "1.3.1"
androidxTestRunner = "1.6.2"
androidxTestRules = "1.6.1"
androidxTestExtJunit = "1.2.1"
junit4 = "4.13.2"
# Room session persistence (:metawear-persistence).
room = "2.8.4"
# KSP >= 2.3.0 uses standalone versioning (decoupled from the Kotlin version)
# and supports AGP 9's built-in Kotlin, which this repo relies on.
ksp = "2.3.9"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.11.4" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
# Nordic Kotlin BLE Library — coroutine/Flow-native GATT client and scanner.
# `client` transitively pulls client-api / client-android / core.
nordic-ble-client = { module = "no.nordicsemi.android.kotlin.ble:client", version.ref = "nordicBle" }
nordic-ble-scanner = { module = "no.nordicsemi.android.kotlin.ble:scanner", version.ref = "nordicBle" }
# Instrumented-test stack (hardware smoke tests in :metawear-core).
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
# Room (:metawear-persistence session storage). Suspend DAOs need no room-ktx:
# the KTX artifact merged into room-runtime in 2.7.
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# No kotlin-android plugin: AGP 9 ships built-in Kotlin (see :metawear-core).
android-library = { id = "com.android.library", version.ref = "agp" }
# Room annotation processing (:metawear-persistence).
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
