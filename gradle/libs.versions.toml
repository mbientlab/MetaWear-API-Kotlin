[versions]
kotlin = "2.1.20"
kotlinxCoroutines = "1.10.1"
kotlinxDatetime = "0.6.2"
junit = "5.11.4"
turbine = "1.2.0"
agp = "9.2.1"
nordicBle = "1.3.1"
androidxTestRunner = "1.6.2"
androidxTestRules = "1.6.1"
androidxTestExtJunit = "1.2.1"
junit4 = "4.13.2"
# Room session persistence (:metawear-persistence).
room = "2.8.4"
# KSP >= 2.3.0 uses standalone versioning (decoupled from the Kotlin version)
# and supports AGP 9's built-in Kotlin, which this repo relies on.
ksp = "2.3.9"
# Nordic Android DFU library (:metawear-firmware).
nordicDfu = "2.9.0"
# ---- :app (Compose demo app) ----
# AGP 9.2.1's built-in Kotlin embeds the 2.2.10 compiler (see the
# kotlin-compiler-embeddable it resolves), so the Compose compiler Gradle
# plugin must be 2.2.10 too — NOT the 2.1.20 used by the pure-JVM module's
# explicit org.jetbrains.kotlin.jvm plugin.
kotlinComposePlugin = "2.2.10"
composeBom = "2025.06.01"
activityCompose = "1.10.1"
navigationCompose = "2.9.0"
lifecycleViewmodelCompose = "2.9.1"
androidxCore = "1.16.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.11.4" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
# Nordic Kotlin BLE Library — coroutine/Flow-native GATT client and scanner.
# `client` transitively pulls client-api / client-android / core.
nordic-ble-client = { module = "no.nordicsemi.android.kotlin.ble:client", version.ref = "nordicBle" }
nordic-ble-scanner = { module = "no.nordicsemi.android.kotlin.ble:scanner", version.ref = "nordicBle" }
# Instrumented-test stack (hardware smoke tests in :metawear-core).
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
# Room (:metawear-persistence session storage). Suspend DAOs need no room-ktx:
# the KTX artifact merged into room-runtime in 2.7.
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
# Annotations-only JAR: lets :app's JVM tests implement the persistence DAO
# interface (in-memory fake) without pulling the Android Room runtime.
androidx-room-common = { module = "androidx.room:room-common", version.ref = "room" }
# Nordic Android DFU library — delegate/broadcast-based firmware flasher
# wrapped into a Flow by :metawear-firmware's DfuSession.
nordic-dfu = { module = "no.nordicsemi.android:dfu", version.ref = "nordicDfu" }
# ---- :app (Compose demo app) ----
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# No kotlin-android plugin: AGP 9 ships built-in Kotlin (see :metawear-core).
android-library = { id = "com.android.library", version.ref = "agp" }
# Room annotation processing (:metawear-persistence).
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# :app — Compose demo app. The Compose compiler Gradle plugin version must
# match AGP's *embedded* Kotlin compiler (2.2.10 for AGP 9.2.1), which is what
# actually compiles Android modules under built-in Kotlin.
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinComposePlugin" }
