# Daemon memory: AGP 9 + built-in Kotlin + KSP + the Compose compiler share one
# daemon classpath; the default 384 MB metaspace overflows during :app builds.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Standard AndroidX flags (required by AGP).
android.useAndroidX=true
